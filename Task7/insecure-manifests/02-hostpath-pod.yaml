apiVersion: v1
kind: Pod
metadata:
  name: pod-hostpath
  namespace: audit-zone
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: host-vol
          mountPath: /host-etc
  volumes:
    - name: host-vol
      hostPath:
        path: /etc
        type: Directory
